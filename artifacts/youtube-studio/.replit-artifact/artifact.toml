kind = "web"
previewPath = "/"
title = "YouTube Content Studio"
description = "A focused workspace for YouTube creators to organize video ideas, evaluate concepts with an AI-ready strategist, and develop editable Shorts scripts into production projects."
version = "1.0.0"
id = "artifacts/youtube-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20994

[services.development]
run = "pnpm --filter @workspace/youtube-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/youtube-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/youtube-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20994"
BASE_PATH = "/"
