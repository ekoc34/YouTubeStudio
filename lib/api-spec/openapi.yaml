openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: YouTube Content Studio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: dashboard
    description: Creator dashboard summaries
  - name: ideas
    description: YouTube content ideas
  - name: strategist
    description: AI-assisted YouTube content strategy
  - name: research
    description: YouTube research and evidence-backed content opportunities
  - name: projects
    description: Content production projects
  - name: scripts
    description: Editable YouTube Shorts scripts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [dashboard]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get creator dashboard summary
      responses:
        "200":
          description: Current idea, project, script, pipeline, and performance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /ideas:
    get:
      operationId: listIdeas
      tags: [ideas]
      summary: List and search ideas
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IdeaStatus"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 160
      responses:
        "200":
          description: Matching ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Idea"
    post:
      operationId: createIdea
      tags: [ideas]
      summary: Create an idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaInput"
      responses:
        "201":
          description: Created idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
        "400":
          $ref: "#/components/responses/BadRequest"
  /ideas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getIdea
      tags: [ideas]
      summary: Get an idea
      responses:
        "200":
          description: Idea details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateIdea
      tags: [ideas]
      summary: Update an idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaUpdate"
      responses:
        "200":
          description: Updated idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteIdea
      tags: [ideas]
      summary: Delete an idea that is not attached to a project
      responses:
        "204":
          description: Idea deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /strategist/ideas:
    post:
      operationId: generateIdeas
      tags: [strategist]
      summary: Generate and save YouTube content ideas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateIdeasInput"
      responses:
        "201":
          description: Generated ideas saved to the idea library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Idea"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/AIUnavailable"
  /strategist/analyze:
    post:
      operationId: analyzeIdea
      tags: [strategist]
      summary: Score and improve a YouTube idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeIdeaInput"
      responses:
        "200":
          description: Strategist analysis with scores and actionable feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategistAnalysis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/AIUnavailable"
  /research/status:
    get:
      operationId: getResearchStatus
      tags: [research]
      summary: Check research provider availability
      responses:
        "200":
          description: Provider configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchStatus"
  /research/sessions:
    get:
      operationId: listResearchSessions
      tags: [research]
      summary: List recent research sessions
      responses:
        "200":
          description: Research history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchSession"
    post:
      operationId: createResearchSession
      tags: [research]
      summary: Create a research session with validated search filters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchSearchInput"
      responses:
        "201":
          description: Research session ready to search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/YouTubeUnavailable"
  /research/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getResearchSession
      tags: [research]
      summary: Open a saved research session
      responses:
        "200":
          description: Saved session with its real video records and optional channel details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSessionDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /research/sessions/{id}/search:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: searchResearchSession
      tags: [research]
      summary: Search YouTube using a saved research session
      responses:
        "200":
          description: Completed search and its real results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSessionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ExternalServiceError"
        "503":
          $ref: "#/components/responses/YouTubeUnavailable"
  /research/search:
    post:
      operationId: searchResearch
      tags: [research]
      summary: Search real YouTube videos and save a research session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchSearchInput"
      responses:
        "201":
          description: Completed research search and its real results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSessionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ExternalServiceError"
        "503":
          $ref: "#/components/responses/YouTubeUnavailable"
  /research/videos/{videoId}:
    parameters:
      - name: videoId
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{11}$"
    get:
      operationId: getResearchVideoDetails
      tags: [research]
      summary: Retrieve public details for a YouTube video
      responses:
        "200":
          description: Real video details returned by the YouTube Data API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YouTubeVideoDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ExternalServiceError"
        "503":
          $ref: "#/components/responses/YouTubeUnavailable"
  /research/trending:
    post:
      operationId: getTrendingResearch
      tags: [research]
      summary: Retrieve YouTube's real most-popular chart for a region
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrendingResearchInput"
      responses:
        "201":
          description: Saved real chart results; chart rank is not a growth trend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSessionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ExternalServiceError"
        "503":
          $ref: "#/components/responses/AIUnavailable"
  /research/channels:
    post:
      operationId: researchChannel
      tags: [research]
      summary: Fetch a channel and its recent public videos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelResearchInput"
      responses:
        "201":
          description: Saved channel research session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSessionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/ExternalServiceError"
        "503":
          $ref: "#/components/responses/YouTubeUnavailable"
  /research/sessions/{id}/analyze:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: analyzeResearchSession
      tags: [research]
      summary: Analyze a saved search using only its real YouTube results
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchAnalysisInput"
      responses:
        "200":
          description: Saved research session with evidence-linked AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSessionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ExternalServiceError"
        "503":
          $ref: "#/components/responses/AIUnavailable"
  /research/sessions/{id}/opportunities:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: generateResearchOpportunities
      tags: [research]
      summary: Generate original content opportunities from saved YouTube results
      responses:
        "200":
          description: Opportunities with real source-video evidence and AI estimates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentOpportunity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/ExternalServiceError"
        "503":
          $ref: "#/components/responses/AIUnavailable"
  /research/channels/{id}/analyze:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: analyzeResearchChannel
      tags: [research]
      summary: Analyze a researched channel for patterns and original opportunities
      responses:
        "200":
          description: Evidence-linked channel analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelAnalysis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AIUnavailable"
  /research/create-idea:
    post:
      operationId: createIdeaFromResearch
      tags: [research]
      summary: Create a normal Ideas-library record from a saved opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResearchIdeaInput"
      responses:
        "201":
          description: Idea saved to the existing Ideas library with research provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AIUnavailable"
  /ideas/{id}/research-sources:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getIdeaResearchSources
      tags: [ideas]
      summary: Get the real YouTube sources attached to an idea
      responses:
        "200":
          description: Sources preserved with the idea
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchSource"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List content projects
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectStatus"
      responses:
        "200":
          description: Content projects with their linked idea and script counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentProject"
    post:
      operationId: createProject
      tags: [projects]
      summary: Start a content project from an idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created content project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentProject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project and its linked idea and scripts
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Rename a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentProject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and its scripts
      responses:
        "204":
          description: Project deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateProjectStatus
      tags: [projects]
      summary: Move a project to a supported production stage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectStatusUpdate"
      responses:
        "200":
          description: Updated project status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentProject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
  /scripts:
    get:
      operationId: listScripts
      tags: [scripts]
      summary: List scripts, optionally within a project
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scripts with their ordered scenes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShortsScript"
  /scripts/generate:
    post:
      operationId: generateScript
      tags: [scripts]
      summary: Generate and save a complete Shorts script from an idea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateScriptInput"
      responses:
        "201":
          description: Generated editable script and project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortsScript"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AIUnavailable"
  /scripts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getScript
      tags: [scripts]
      summary: Get a script and its ordered scenes
      responses:
        "200":
          description: Script details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortsScript"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateScript
      tags: [scripts]
      summary: Edit a draft script and its scenes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptUpdate"
      responses:
        "200":
          description: Updated draft script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortsScript"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /scripts/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: approveScript
      tags: [scripts]
      summary: Approve a script after editing
      responses:
        "200":
          description: Approved script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortsScript"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AIUnavailable:
      description: The configured AI provider is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    YouTubeUnavailable:
      description: YouTube Data API is not configured or is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ExternalServiceError:
      description: YouTube Data API request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    IdeaStatus:
      type: string
      enum: [NEW, RESEARCHING, APPROVED, REJECTED, SCRIPTING, READY]
    IdeaSource:
      type: string
      enum: [MANUAL, STRATEGIST, RESEARCH]
    ProjectStatus:
      type: string
      enum:
        - IDEA
        - RESEARCH
        - SCRIPT
        - SCENES
        - MEDIA
        - VOICE
        - EDIT
        - QUALITY_CHECK
        - READY
        - UPLOADED
        - PUBLISHED
        - FAILED
    ScriptStatus:
      type: string
      enum: [DRAFT, APPROVED]
    Idea:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        topic: { type: string }
        hook: { type: string }
        description: { type: string }
        targetAudience: { type: string }
        format: { type: string }
        estimatedDuration: { type: integer }
        viralScore: { type: ["integer", "null"], minimum: 0, maximum: 100 }
        originalityScore: { type: ["integer", "null"], minimum: 0, maximum: 100 }
        rationale: { type: ["string", "null"] }
        weaknesses:
          type: array
          items: { type: string }
        improvements:
          type: array
          items: { type: string }
        opportunityScore: { type: ["integer", "null"], minimum: 0, maximum: 100 }
        researchSessionId: { type: ["string", "null"], format: uuid }
        researchOpportunityId: { type: ["string", "null"], format: uuid }
        researchSourceVideoIds:
          type: array
          items: { type: string }
        researchEvidence: { type: ["string", "null"] }
        originalityConsiderations:
          type: array
          items: { type: string }
        source:
          $ref: "#/components/schemas/IdeaSource"
        status:
          $ref: "#/components/schemas/IdeaStatus"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - title
        - topic
        - hook
        - description
        - targetAudience
        - format
        - estimatedDuration
        - viralScore
        - originalityScore
        - rationale
        - weaknesses
        - improvements
        - opportunityScore
        - researchSessionId
        - researchOpportunityId
        - researchSourceVideoIds
        - researchEvidence
        - originalityConsiderations
        - source
        - status
        - createdAt
        - updatedAt
    IdeaInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        topic: { type: string, minLength: 1, maxLength: 200 }
        hook: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 3000 }
        targetAudience: { type: string, minLength: 1, maxLength: 240 }
        format: { type: string, minLength: 1, maxLength: 100 }
        estimatedDuration: { type: integer, minimum: 10, maximum: 180 }
      required: [title, topic, hook, description, targetAudience, format, estimatedDuration]
    IdeaUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        topic: { type: string, minLength: 1, maxLength: 200 }
        hook: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 3000 }
        targetAudience: { type: string, minLength: 1, maxLength: 240 }
        format: { type: string, minLength: 1, maxLength: 100 }
        estimatedDuration: { type: integer, minimum: 10, maximum: 180 }
        status:
          $ref: "#/components/schemas/IdeaStatus"
    GenerateIdeasInput:
      type: object
      properties:
        topic: { type: string, maxLength: 200 }
        targetAudience: { type: string, maxLength: 240 }
        format: { type: string, maxLength: 100 }
        count: { type: integer, minimum: 1, maximum: 8, default: 4 }
    AnalyzeIdeaInput:
      type: object
      properties:
        ideaId: { type: string, format: uuid }
        title: { type: string, maxLength: 180 }
        topic: { type: string, maxLength: 200 }
        hook: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 3000 }
        targetAudience: { type: string, maxLength: 240 }
        format: { type: string, maxLength: 100 }
        estimatedDuration: { type: integer, minimum: 10, maximum: 180 }
    ResearchStatus:
      type: object
      properties:
        youtubeConfigured: { type: boolean }
        aiConfigured: { type: boolean }
      required: [youtubeConfigured, aiConfigured]
    ResearchSessionKind:
      type: string
      enum: [SEARCH, POPULAR, CHANNEL]
    ResearchStatusValue:
      type: string
      enum: [RUNNING, COMPLETED, FAILED]
    ResearchFilters:
      type: object
      properties:
        language: { type: ["string", "null"] }
        region: { type: ["string", "null"] }
        contentType:
          type: string
          enum: [SHORTS, LONG_FORM, BOTH]
        timeRange:
          type: string
          enum: [TODAY, WEEK, MONTH, CUSTOM, ALL_TIME]
